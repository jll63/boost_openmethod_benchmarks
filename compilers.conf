# One compiler per line, in column order; the first is the reference build the
# single-column sections are taken from. Everything downstream reads this file:
# matrix.sh builds and measures each, probes.sh builds the disassembly oracle
# for each, report.py makes one table column per line, asmtab.py one listing
# column. Adding a compiler is adding a line and re-running ./matrix.sh,
# ./probes.sh and the two generators.
#
# The name is the command; the column label is derived from it (clang++-22 ->
# "clang 22"), and the results file is named after it. Comments and blank
# lines are ignored.

clang++-22
g++-15
g++-13
